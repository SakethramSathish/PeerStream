[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bittorrent-client"
version = "0.1.0"
description = "A BitTorrent client built from scratch in Python with a real-time network observability UI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Build Your Own BitTorrent" }]
keywords = ["bittorrent", "p2p", "asyncio", "networking", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    # No licence classifier: setuptools deprecates them in favour of the
    # `license` field above, and declaring both only produces a build warning.
    #
    # No Windows classifier either. The storage layer no longer assumes POSIX
    # (see app/storage/files.py) and CI runs its portability tests on Windows,
    # but the rest of the suite has never been run there, and a classifier is a
    # claim rather than an intention.
]

# Runtime dependencies are deliberately minimal: the protocol stack itself is
# implemented in-repo (bencode, tracker clients, peer wire protocol, DHT).
dependencies = [
    "aiohttp>=3.9",        # async HTTP/HTTPS tracker announce + scrape
    "PySide6>=6.6",        # desktop UI (see [project.optional-dependencies] ui)
]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "psutil>=5.9",
    # tests/tools/test_packaging.py compares the build configuration against the
    # packages on disk, and it does that with setuptools' own finder rather than
    # a reimplementation that could agree with a broken config. Without these
    # the check cannot run at all.
    "setuptools>=68",
    "wheel",
]

[project.scripts]
bittorrent = "cli.main:main"

[tool.setuptools]
# Every subpackage, not just the three top-level ones: listing ["app", "cli",
# "tools"] ships the directories and none of their modules, which installs a
# client that imports and immediately fails.
packages = { find = { include = ["app*", "cli*", "tools*"] } }

[tool.setuptools.package-data]
app = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A default timeout: this suite opens sockets, and a test that waits forever
# must fail loudly (with a stack dump) instead of blocking the run.
addopts = "-ra --strict-markers --timeout=120 --timeout-method=thread"
markers = [
    "integration: end-to-end flows over local sockets",
    "slow: tests that take more than a second",
    "network: tests that require outbound internet access",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "cli", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
# Resolve module names from the repository root only. Without this, mypy sees
# app/** both as "app.x" (repo root base) and "x" (editable-install base).
explicit_package_bases = true
warn_unreachable = true
plugins = []
exclude = ["tests/", "build/"]
